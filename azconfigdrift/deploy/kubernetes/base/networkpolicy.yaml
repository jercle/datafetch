# Nothing connects to the collector; it connects out to Microsoft's APIs
# and to MongoDB. Needs a network plugin that enforces policies (Azure CNI
# with Cilium or Calico on AKS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: az-config-drift
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: az-config-drift }
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - ports:
        - { protocol: TCP, port: 443 }    # Microsoft's APIs, Cosmos DB for MongoDB vCore
        - { protocol: TCP, port: 27017 }  # MongoDB, Atlas
        - { protocol: TCP, port: 10255 }  # Cosmos DB for MongoDB (RU)
