apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Production on AKS: a pinned image, and the two secrets from Azure Key
# Vault through the Secrets Store CSI driver (the AKS add-on
# azure-keyvault-secrets-provider) with workload identity.
# deploy/terraform/aks creates the identity and prints the values for the
# placeholders below.
namespace: az-config-drift
resources:
  - ../../base
  - secret-provider.yaml
images:
  - name: REGISTRY.azurecr.io/datafetch
    newName: myregistry.azurecr.io/datafetch   # <- your registry
    newTag: "1.0.0"                                  # <- never "latest"
replicas:
  - name: az-config-drift
    count: 3
configMapGenerator:
  # What is not secret. A change makes a new ConfigMap name, which rolls the pods.
  - name: az-config-drift
    literals:
      - AZURE_APPCONFIG_ENDPOINT=https://mystore.azconfig.io   # <-
      - AZURE_APPCONFIG_TENANT_ID=00000000-0000-0000-0000-000000000000   # <-
      - AZURE_APPCONFIG_CLIENT_ID=00000000-0000-0000-0000-000000000000   # <- the service principal that reads App Configuration
      # - AZURE_APPCONFIG_LABEL=production
patches:
  - target: { kind: ServiceAccount, name: az-config-drift }
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000   # <- terraform output secrets_identity_client_id
  - target: { kind: Deployment, name: az-config-drift }
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/azure.workload.identity~1use
        value: "true"
      - op: replace
        path: /spec/template/spec/containers/0/envFrom
        value:
          - configMapRef: { name: az-config-drift }
          - secretRef: { name: az-config-drift }
      # The driver only fills the Secret while a pod has the volume mounted.
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: secrets
            csi:
              driver: secrets-store.csi.k8s.io
              readOnly: true
              volumeAttributes: { secretProviderClass: az-config-drift }
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - { name: secrets, mountPath: /mnt/secrets, readOnly: true }
