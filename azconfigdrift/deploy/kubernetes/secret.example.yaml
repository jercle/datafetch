# What the collector needs to start. Everything else is read from App
# Configuration. Prefer the Secrets Store CSI driver with Key Vault over a
# Secret kept in a file; this shows which variables are expected.
apiVersion: v1
kind: Secret
metadata:
  name: az-config-drift
type: Opaque
stringData:
  AZURE_APPCONFIG_ENDPOINT: https://<store>.azconfig.io
  # A service principal with App Configuration Data Reader on the store…
  AZURE_APPCONFIG_TENANT_ID: <tenant id>
  AZURE_APPCONFIG_CLIENT_ID: <client id>
  AZURE_APPCONFIG_CLIENT_SECRET: <client secret>
  # …and where MongoDB is, unless datafetching.azConfigDrift.mongo.uri is set in App
  # Configuration (as a Key Vault reference).
  AZCONFIGDRIFT_MONGO_URI: mongodb+srv://<user>:<password>@<cluster>/
