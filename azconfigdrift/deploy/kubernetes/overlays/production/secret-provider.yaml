# Copies two Key Vault secrets into the Secret "az-config-drift", which the
# Deployment reads its environment from. The tenants' own client secrets
# are not here: they are Key Vault references in App Configuration, which
# the collector resolves itself.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: az-config-drift
spec:
  provider: azure
  parameters:
    clientID: 00000000-0000-0000-0000-000000000000   # <- terraform output secrets_identity_client_id
    tenantId: 00000000-0000-0000-0000-000000000000   # <- the Key Vault's tenant
    keyvaultName: my-key-vault                       # <-
    objects: |
      array:
        - |
          objectName: az-config-drift-appconfig-client-secret
          objectType: secret
        - |
          objectName: az-config-drift-mongo-uri
          objectType: secret
  secretObjects:
    - secretName: az-config-drift
      type: Opaque
      data:
        - { objectName: az-config-drift-appconfig-client-secret, key: AZURE_APPCONFIG_CLIENT_SECRET }
        - { objectName: az-config-drift-mongo-uri, key: AZCONFIGDRIFT_MONGO_URI }
